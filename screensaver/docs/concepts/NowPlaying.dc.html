<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now playing, album focus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#E8C9A8}a:hover{color:#F5E2CE}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 56px 80px; background: {{tint}}; color: #F2ECE6; font-family: Roboto, sans-serif; display: flex; flex-direction: column; justify-content: space-between">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 400; letter-spacing: 2px; color: #BFB3A8">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      NOW PLAYING  ·  [Source app]
    </div>
    <div style="font-size: 36px; font-weight: 300">10:42</div>
  </div>

  <div style="display: flex; align-items: center; gap: 64px">
    <div style="width: 420px; height: 420px; flex-shrink: 0; border-radius: 12px; background: #6B4A36; display: flex; align-items: center; justify-content: center; color: #E8D3C2; font-size: 20px; font-weight: 400; letter-spacing: 1px">[Album art]</div>
    <div style="display: flex; flex-direction: column; gap: 14px; min-width: 0; flex: 1">
      <div style="font-size: 64px; font-weight: 400; line-height: 1.1">Track title</div>
      <div style="font-size: 34px; font-weight: 300; color: #E0D4C8">Artist name</div>
      <div style="font-size: 24px; font-weight: 300; color: #BFB3A8">Album name  ·  2019</div>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 36px">
        <div style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.18); position: relative"><div style="position: absolute; left: 0; width: 38%; top: 0; bottom: 0; border-radius: 3px; background: #F2ECE6"></div></div>
        <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 300; color: #BFB3A8"><span>1:24</span><span>3:41</span></div>
      </div>
      <div style="font-size: 18px; font-weight: 300; color: #BFB3A8; margin-top: 8px">Up next: Next track title — Artist name</div>
    </div>
  </div>

  <div style="height: 1px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tint":{"editor":"color","default":"#241811","options":["#241811","#0F1A24","#1A1424","#000000"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { tint: this.props.tint ?? '#241811' };
  }
}
</script>
</body>
</html>
