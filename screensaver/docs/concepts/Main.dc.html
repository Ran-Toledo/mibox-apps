<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weather forecast board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#9FC3E8}a:hover{color:#CFE2F5}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 56px 72px; background: {{bg}}; color: #E8EEF5; font-family: Roboto, sans-serif; display: flex; flex-direction: column; justify-content: space-between">
  <div style="display: flex; justify-content: space-between; align-items: flex-start">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 26px; font-weight: 400; letter-spacing: 0.5px">[City]</div>
      <div style="font-size: 18px; font-weight: 300; color: #9AAABB">Updated 10:40</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
      <div style="font-size: 44px; font-weight: 300; letter-spacing: 1px">10:42</div>
      <div style="font-size: 18px; font-weight: 300; color: #9AAABB">Friday, 6 November</div>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; gap: 64px">
    <div style="display: flex; align-items: center; gap: 40px">
      <svg width="150" height="150" viewBox="0 0 48 48" fill="none" stroke="#F5C76A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="18" cy="17" r="7"></circle>
        <path d="M18 4v3M18 27v3M5 17h3M28 17h3M8.8 7.8l2.1 2.1M25.2 24.2l2.1 2.1M8.8 26.2l2.1-2.1M27.3 7.8l-2.1 2.1"></path>
        <path d="M16 40h21a7 7 0 0 0 0-14 9 9 0 0 0-17 3 5.5 5.5 0 0 0-4 11z" stroke="#C9D6E3" fill="{{bg}}"></path>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 200px; font-weight: 100; line-height: 0.9; letter-spacing: -6px">18°</div>
        <div style="font-size: 30px; font-weight: 300">Partly cloudy</div>
        <div style="font-size: 20px; font-weight: 300; color: #9AAABB">H 21°  ·  L 12°  ·  Feels like 17°</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; min-width: 300px">
      <div style="font-size: 16px; font-weight: 500; letter-spacing: 2px; color: #9AAABB">NEXT 3 DAYS</div>
      <div style="display: grid; grid-template-columns: 70px 40px minmax(0, 1fr) 50px; align-items: center; column-gap: 16px; row-gap: 18px; font-size: 24px; font-weight: 300">
        <div>Sat</div>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F5C76A" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"></path></svg>
        <div style="height: 6px; border-radius: 3px; background: #24364A; position: relative"><div style="position: absolute; left: 20%; right: 10%; top: 0; bottom: 0; border-radius: 3px; background: #F5C76A"></div></div>
        <div style="text-align: right">23°</div>
        <div>Sun</div>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#C9D6E3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.3 2A3.5 3.5 0 0 0 7 18z"></path></svg>
        <div style="height: 6px; border-radius: 3px; background: #24364A; position: relative"><div style="position: absolute; left: 25%; right: 30%; top: 0; bottom: 0; border-radius: 3px; background: #9FC3E8"></div></div>
        <div style="text-align: right">19°</div>
        <div>Mon</div>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#7FB2E5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15h10a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.3 2A3.5 3.5 0 0 0 7 15z" stroke="#C9D6E3"></path><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"></path></svg>
        <div style="height: 6px; border-radius: 3px; background: #24364A; position: relative"><div style="position: absolute; left: 15%; right: 45%; top: 0; bottom: 0; border-radius: 3px; background: #7FB2E5"></div></div>
        <div style="text-align: right">16°</div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="font-size: 16px; font-weight: 500; letter-spacing: 2px; color: #9AAABB">NEXT HOURS  ·  Rain likely from 16:00</div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; border-top: 1px solid #24364A; padding-top: 18px">
      <sc-for list="{{hours}}" as="h" hint-placeholder-count="6">
        <div style="display: flex; align-items: baseline; gap: 12px; font-weight: 300">
          <div style="font-size: 20px; color: #9AAABB">{{h.t}}</div>
          <div style="font-size: 28px">{{h.temp}}</div>
          <div style="font-size: 18px; color: #7FB2E5">{{h.rain}}</div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#0B1420","options":["#0B1420","#000000","#14100B","#0E1A12"]},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      bg: this.props.bg ?? '#0B1420',
      hours: [
        { t: '11:00', temp: '18°', rain: '' },
        { t: '12:00', temp: '19°', rain: '' },
        { t: '13:00', temp: '20°', rain: '10%' },
        { t: '14:00', temp: '20°', rain: '30%' },
        { t: '15:00', temp: '19°', rain: '55%' },
        { t: '16:00', temp: '17°', rain: '80%' }
      ]
    };
  }
}
</script>
</body>
</html>
